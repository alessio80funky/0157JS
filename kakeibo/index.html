<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <title>家計簿</title>
</head>
<body>

    <div class="container">

        <h1>家計簿</h1>

         <!--－収支合計セクション-->

         <div class="summary">
            <div class="summary-item">
                <span class="label">収入</span>
                <span class="amount income" id="totalIncome">0円</span>
            </div>
             <div class="summary-item">
                <span class="label">支出</span>
                <span class="amount expense" id="totalExpense">0円</span>
             </div>
              <div class="summary-item">
                <span class="label">合計</span>
                <span class="amount balance" id="balance">0円</span>
              </div>

              
         <!--入力フォーム-->

              <div class="form-container">

                <h2>取引追加</h2>

                <form id="transactionForm">
                    <div class="form-group">
                        <label for="description">内容</label>
                        <input type="text" id="description" placeholder="例：外食費用">
                    </div>
                     <div class="form-group">
                        <label for="description">金額</label>
                        <input type="number" id="amount" placeholder="例:1000">
                    </div>
                     <div class="form-group">
                        <label for="type" >種類</label>
                        <select id="type" required>
                    <option value="income">収入</option>
                     <option value="expense">収支</option>
                        </select>
                    
                 
                    </div>

                    <button type="submit" class="btn-submit">追加</button>
                </form>

              </div>

         </div>

        <!--取引履歴のセクション-->

         <div class="transactions-container">
            <h2>取引履歴</h2>
            <ul id="transactionList" class="transaction-list"></ul>
         </div>




         <div class="chart-area">
            <h1>グラフ</h1>
            <canvas id="Chart"></canvas>

         </div>

    </div>

   

    <script src="./script.js"></script>
    
</body>
</html>
