<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
body { font-family: sans-serif; max-width:480px; margin: 20px auto; padding: 12px;}
button , input{padding: 10px auto; font-size: 16px; width: 100%;}
.ok{
    color: green;
}

.error{
    color: red;
}
    </style>
    <title>Try..catch...finally</title>
</head>
<body>
<h1>ログインテスト</h1>
<input id="user" placeholder="ユーザー名">
<input id="password" type="password" placeholder="パスワード">
<button id="login">ログイン</button>
<div id="result"></div>

    <script>

        document.getElementById("login").addEventListener("click", ()=>{
            const user = document.getElementById("user").value;
            const pass = document.getElementById("password").value;
            const res = document.getElementById("result");
            try{

                if(!user && !pass){
                  throw new Error("パスワードとユーザー名を入力してください");
                }

                if(!user && pass) {
                    throw new Error("ユーザー名を入力してください");
                }

                if(user && !pass) {
                     throw new Error("ユーザー名を入力してください");
                } 

                /*
                解読性低い

                if(!user && !pass){
                    throw new Error("パスワードとユーザー名を入力してください")
                }else if(!user && pass){
                     throw new Error("ユーザー名を入力してください")
                 }else if(user && !pass){
                     throw new Error("パスワードを入力してください")
                }*/

                if(user === "maru" && pass === "1234"){
                    res.textContent = "✅ログイン成功";
                    res.className = "ok";
                }else{
                    throw new Error("ユーザー名とパスワーが違います")
                }


            }catch(error){
                 res.textContent = "✖ログイン失敗:" + error.message;
                    res.className = "error";
            }finally{
                console.log("ログイン完了")
            }
        })

    </script>
</body>
</html>
